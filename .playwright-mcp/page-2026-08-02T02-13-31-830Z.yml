        - generic [ref=e332]: Estimator
        - paragraph [ref=e333]: Isotropic gaussian kernel density on a 300 × 300 lattice spanning 6.116–7.455 °N, 80.081–80.981 °E. Cells are 0.49 km north–south and 0.33 km east–west; the display preserves that anisotropy rather than squaring the grid.
      - generic [ref=e334]:
        - generic [ref=e335]: Bandwidth
        - paragraph [ref=e336]: h = 0.8972 km, selected by cross-validation on the pooled record set and held constant across all seven bins. Stated, not tuned per panel. At this bandwidth a single isolated record produces a visible ~2 km bloom — worth remembering when looking at 1990–94.
      - generic [ref=e337]:
        - generic [ref=e338]: Effort bias
        - paragraph [ref=e339]:
          - text: Records are opportunistic, not survey-designed. Density here is density
          - emphasis [ref=e340]: of observations
          - text: . No effort correction, no detection model, no accessibility covariate has been applied — roads, reserve boundaries and birder itineraries are all in this surface.
      - generic [ref=e341]:
        - generic [ref=e342]: Not a range shift
        - paragraph [ref=e343]: Nothing here supports a claim about range expansion, contraction or climate-driven movement. Frames cross-dissolve between bins for legibility; no values are interpolated — every frame is a separately computed surface. The honest headline is a stable core around Sinharaja and a record set that grew up around it.
